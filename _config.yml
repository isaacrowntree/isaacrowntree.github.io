name: Isaac Rowntree

description: Head of Tech at CamperMate. Coder, dancer, photographer, videographer, trombonist, motorcyclist. Shipping software since 2002.

google_analytics: G-VSVH3S0MFD

url: https://isaacrowntree.com

# SEO settings
title: Isaac Rowntree
# Short tagline keeps jekyll-seo-tag from appending the full description to
# <title> — the old title ran to 152 characters and Google truncates ~60.
tagline: Head of Tech · Software engineering
author: Isaac Rowntree
logo: /images/isaacAlt.jpg

# og:image — jekyll-seo-tag reads page.image, not site.image, so this has to
# come through defaults or link previews stay text-only.
defaults:
  - scope:
      path: ""
    values:
      image: /images/isaacAlt.jpg

twitter:
  card: summary_large_image
social:
  name: Isaac Rowntree
  links:
    - https://github.com/isaacrowntree
    - https://twitter.com/tikwanleep
    - https://www.linkedin.com/in/zemonstas/
    - https://www.instagram.com/zemonstas

# Schema.org / JSON-LD
schema:
  "@context": https://schema.org
  "@type": Person
  name: Isaac Rowntree
  url: https://isaacrowntree.com
  image: https://isaacrowntree.com/images/isaacAlt.jpg
  sameAs:
    - https://github.com/isaacrowntree
    - https://twitter.com/tikwanleep
    - https://www.linkedin.com/in/zemonstas/
    - https://www.instagram.com/zemonstas
    - https://zackdesign.biz
  jobTitle: Head of Tech
  worksFor:
    "@type": Organization
    name: CamperMate
  alumniOf:
    "@type": EducationalOrganization
    name: Bachelor of Applied Science (Information Technology)
  knowsAbout:
    - Software Engineering
    - Engineering Leadership
    - Serverless Architecture
    - Cloudflare Workers
    - React Native
    - Next.js
    - TypeScript
    - Supabase
    - PlanetScale
    - Typesense
    - AI Development
    - Vector Search
    - RAG Systems
    - LLM Integration

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - .git
# NOTE: CNAME is intentionally NOT excluded — it must ship in the built
# artifact so the isaacrowntree.com custom domain is preserved on deploy.

plugins:
  - jekyll-seo-tag
